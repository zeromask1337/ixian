[package]
name = "ixian"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
mime_guess = "2"
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
